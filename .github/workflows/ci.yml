name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Light, always-on gate: repo hygiene + script lint. Does NOT compile Zap —
  # the Zap toolchain needs an LLVM 18 build (see the `compile-and-test` job).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell script syntax
        run: |
          for f in scripts/*.sh; do
            echo "sh -n $f"
            sh -n "$f"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

      - name: Layout sanity
        run: |
          test -f zap.toml
          test -f src/runtime.zap
          test -f examples/echo/handler.zap
          test -f test/mock_runtime.zap
          test -f test/offline_test.zap
          test -s test/offline_test.expected
          # The concatenated compilation units must be formable.
          mkdir -p build
          cat src/runtime.zap examples/echo/handler.zap > build/_check_bootstrap.zap
          cat src/runtime.zap test/mock_runtime.zap test/offline_test.zap > build/_check_test.zap
          echo "layout OK"

      - name: No CRLF / no tabs in .zap sources
        run: |
          ! grep -rlP '\r$' --include='*.zap' . || (echo "CRLF found" && exit 1)
          ! grep -rlP '\t' --include='*.zap' . || (echo "tab found in .zap" && exit 1)

  # Full gate: build the Zap toolchain from source (LLVM 18) and run the offline
  # test. Opt-in (workflow_dispatch) for v1 — building the compiler is heavy and
  # there is no published `zap` release/image yet. Promoting this to an always-on
  # gate is a follow-up, gated on a distributable toolchain (zaplang-io/zap
  # releases, zaplang-io/zap#207) or the LLVM 18 dev container image.
  compile-and-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aws-lambda-runtime
        uses: actions/checkout@v4
        with:
          path: aws-lambda-runtime

      - name: Checkout zap toolchain
        uses: actions/checkout@v4
        with:
          repository: zaplang-io/zap
          path: zap

      - name: Install LLVM 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-18 llvm-18-dev clang-18 libclang-18-dev libgc-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Build zap (with codegen)
        working-directory: zap
        run: cargo build --release -p zapc --features llvm --bin zap

      - name: Run the offline runtime test
        working-directory: aws-lambda-runtime
        run: ZAP="$GITHUB_WORKSPACE/zap/target/release/zap" sh scripts/run-tests.sh

      - name: Build the echo bootstrap
        working-directory: aws-lambda-runtime
        run: |
          ZAP="$GITHUB_WORKSPACE/zap/target/release/zap" \
            sh scripts/bootstrap.sh "$PWD/examples/echo/handler.zap" -o build/bootstrap
          test -x build/bootstrap
